name: Build InstagramKeepAlive Dylib

on:
  push:
    branches: [ main, master, dev, "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Unit Tests
        run: |
          python3 test_keepalive.py

      - name: Compile InstagramKeepAlive.dylib
        run: |
          chmod +x build.sh
          ./build.sh
          ls -lh InstagramKeepAlive.dylib
          file InstagramKeepAlive.dylib

      - name: Release Dylib (After Build Action Complete)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD_TAG="v${{ github.run_number }}"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Tag this specific build
          git tag -f "$BUILD_TAG" HEAD
          git push origin -f tag "$BUILD_TAG" || true
          
          # Also update rolling latest tag
          git tag -f latest HEAD
          git push origin -f tag latest || true
          
          # Delete pre-existing release with this tag if re-run
          gh release delete "$BUILD_TAG" --yes || true
          
          # Create GitHub Release with direct raw uncompressed dylib
          gh release create "$BUILD_TAG" InstagramKeepAlive.dylib \
            --title "InstagramKeepAlive Build #${{ github.run_number }}" \
            --notes "Continuous build of InstagramKeepAlive.dylib (commit ${{ github.sha }}). Direct uncompressed binary for LiveContainer, TrollStore, or Sideloading." \
            --latest
